<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>아파트 웹서비스 UI 리뉴얼 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== 디자인 토큰 (Figma Variables와 같은 이름) ===== */
:root{
  --color-bg:#ffffff; --color-surface:#f7f8fa; --color-line:#e6e8ec; --color-line-strong:#d3d7de;
  --color-text:#15181e; --color-text-2:#4a515c; --color-text-3:#7a828e;
  --color-primary:#2f5bea; --color-primary-hover:#2149cc; --color-primary-pressed:#1a3ba6; --color-primary-soft:#edf2ff;
  --color-accent:#14b8a6; --color-success:#16a34a; --color-success-soft:#e8f7ee; --color-warning:#d97706; --color-warning-soft:#fdf3e2; --color-danger:#dc2626; --color-danger-soft:#fdecec;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --shadow-1:0 1px 2px rgba(21,24,30,.05),0 2px 8px rgba(21,24,30,.05);
  --shadow-2:0 8px 28px rgba(21,24,30,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#eef0f4;color:var(--color-text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ===== 시안 보드 (발표용 바깥 틀) ===== */
.board-top{position:sticky;top:0;z-index:50;background:#15181e;color:#d6dae1;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.board-top b.tag{background:#ffd75e;color:#111;border-radius:6px;padding:2px 8px;font-size:12px}
.board-top .ttl{font-weight:700;color:#fff;font-size:14px}
.board-top .sp{flex:1}
.seg{display:inline-flex;background:#262a33;border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:#c3c8d0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700}
.seg button.on{background:#fff;color:#111}
.board{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}
.nav{background:#fff;border-right:1px solid var(--color-line);padding:16px 10px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.nav h4{font-size:12px;color:var(--color-text-3);margin:14px 10px 6px;font-weight:700}
.nav button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--color-text-2);font-weight:600}
.nav button:hover{background:var(--color-surface)}
.nav button.on{background:var(--color-primary-soft);color:var(--color-primary)}
.nav button i{font-style:normal;font-size:11px;color:var(--color-text-3);margin-left:auto}
.stage{padding:24px;overflow:auto}
.stage-head{display:flex;align-items:baseline;gap:10px;margin:0 auto 12px;max-width:1280px}
.stage-head h2{margin:0;font-size:18px}
.stage-head span{color:var(--color-text-3);font-size:13px}
.frame{container-type:inline-size;background:var(--color-bg);margin:0 auto;border-radius:16px;box-shadow:0 10px 40px rgba(21,24,30,.12);overflow:hidden;transition:max-width .25s}
.frame.pc{width:1280px}
.frame.mo{max-width:390px;border-radius:28px;border:8px solid #15181e}
.note{max-width:1280px;margin:14px auto 0;font-size:13px;color:var(--color-text-2);background:#fff;border:1px dashed var(--color-line-strong);border-radius:12px;padding:12px 14px}
.note b{color:var(--color-text)}

/* ===== 공통 컴포넌트 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:var(--radius-md);border:1px solid transparent;font-weight:700;font-size:15px;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover,.btn-primary.is-hover{background:var(--color-primary-hover)}
.btn-primary:active,.btn-primary.is-pressed{background:var(--color-primary-pressed)}
.btn-primary:disabled,.btn-primary.is-disabled{background:#c9d3f0;cursor:not-allowed}
.btn-secondary{background:#fff;border-color:var(--color-line-strong);color:var(--color-text)}
.btn-secondary:hover,.btn-secondary.is-hover{background:var(--color-surface)}
.btn-ghost{background:transparent;color:var(--color-text-2)}
.btn-ghost:hover{background:var(--color-surface)}
.btn-sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-lg{height:52px;padding:0 24px;font-size:16px}
.btn-block{width:100%}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--color-text-2)}
.input{height:46px;border:1px solid var(--color-line-strong);border-radius:var(--radius-md);padding:0 14px;background:#fff;font-size:15px;width:100%;outline:0}
.input:focus,.input.is-focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.input.is-error{border-color:var(--color-danger);box-shadow:0 0 0 3px rgba(220,38,38,.10)}
.input:disabled,.input.is-disabled{background:var(--color-surface);color:var(--color-text-3)}
.help{font-size:12px;color:var(--color-text-3)}
.help.err{color:var(--color-danger)}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:var(--radius-full);font-size:12px;font-weight:700;white-space:nowrap}
.badge-blue{background:var(--color-primary-soft);color:var(--color-primary)}
.badge-green{background:var(--color-success-soft);color:var(--color-success)}
.badge-amber{background:var(--color-warning-soft);color:var(--color-warning)}
.badge-red{background:var(--color-danger-soft);color:var(--color-danger)}
.badge-gray{background:var(--color-surface);color:var(--color-text-2);border:1px solid var(--color-line)}
.chip{height:36px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--color-line-strong);background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--color-text);color:#fff;border-color:var(--color-text)}
.card{background:#fff;border:1px solid var(--color-line);border-radius:var(--radius-lg)}
.ico{display:inline-grid;place-items:center}
.muted{color:var(--color-text-2)}
.sub{color:var(--color-text-3);font-size:13px}
h1,h2,h3{letter-spacing:-.02em}

/* ===== 서비스 헤더 ===== */
.gnb{height:64px;display:flex;align-items:center;gap:28px;padding:0 32px;border-bottom:1px solid var(--color-line);background:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--color-primary);display:grid;place-items:center;color:#fff}
.gnb nav{display:flex;gap:4px}
.gnb nav a{padding:8px 12px;border-radius:10px;font-weight:600;color:var(--color-text-2);text-decoration:none;font-size:15px}
.gnb nav a.on{color:var(--color-text)}
.gnb .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.gnb .cart{position:relative}
.gnb .cart em{position:absolute;right:4px;top:4px;background:var(--color-danger);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center}
.gnb .mo-only{display:none}
.wrap{padding:32px}
.foot{border-top:1px solid var(--color-line);padding:24px 32px;font-size:13px;color:var(--color-text-3);display:flex;gap:16px;flex-wrap:wrap}

/* 홈 */
.hero{padding:56px 32px 40px;background:linear-gradient(180deg,#f3f6ff 0%,#fff 100%)}
.hero h1{font-size:40px;line-height:1.2;margin:0 0 10px}
.hero p{margin:0 0 24px;color:var(--color-text-2);font-size:17px}
.bigsearch{display:flex;gap:8px;max-width:640px;background:#fff;border:1px solid var(--color-line-strong);border-radius:var(--radius-xl);padding:8px;box-shadow:var(--shadow-2)}
.bigsearch input{flex:1;border:0;outline:0;padding:0 12px;font-size:16px;min-width:0}
.hot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--color-text-3);align-items:center}
.hot button{border:0;background:#fff;border:1px solid var(--color-line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--color-text-2)}
.sec-t{display:flex;justify-content:space-between;align-items:end;margin:0 0 16px}
.sec-t h2{margin:0;font-size:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cx{overflow:hidden}
.cx .th{aspect-ratio:4/3;background:var(--color-surface);display:grid;place-items:center;border-bottom:1px solid var(--color-line);position:relative}
.cx .th .badge{position:absolute;left:10px;top:10px}
.cx .bd{padding:14px 16px 16px}
.cx b{display:block;font-size:16px}
.cx .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{padding:22px}
.step .n{width:36px;height:36px;border-radius:12px;background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;font-weight:900;margin-bottom:12px}
.step h3{margin:0 0 4px;font-size:17px}

/* 검색 */
.search-layout{display:grid;grid-template-columns:260px 1fr;gap:24px}
.filter{padding:18px;align-self:start}
.filter h3{font-size:15px;margin:0 0 10px}
.filter .grp{padding:14px 0;border-top:1px solid var(--color-line)}
.filter .grp:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.range{display:flex;gap:6px;align-items:center}
.range .input{height:40px}
.result-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.result-bar b{font-size:18px}
.lrow{display:grid;grid-template-columns:120px 1fr auto;gap:16px;padding:14px;align-items:center;margin-bottom:10px}
.lrow .th{width:120px;height:90px;border-radius:var(--radius-md);background:var(--color-surface);display:grid;place-items:center}
.lrow h3{margin:0 0 4px;font-size:17px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--color-text-2)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.price{font-weight:800;font-size:16px;text-align:right}
.price small{display:block;font-weight:500;color:var(--color-text-3);font-size:12px}

/* 상세 */
.crumb{font-size:13px;color:var(--color-text-3);margin-bottom:10px}
.detail{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
.plan-box{border:1px solid var(--color-line);border-radius:var(--radius-lg);background:#fbfcfd;aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden}
.plan-box .wm{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:40px;color:rgba(47,91,234,.07);transform:rotate(-18deg);pointer-events:none}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--color-line);margin:18px 0}
.tabs button{border:0;background:none;padding:12px 6px;margin-right:12px;font-weight:700;color:var(--color-text-3);border-bottom:2px solid transparent;font-size:15px}
.tabs button.on{color:var(--color-text);border-color:var(--color-text)}
.spec{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden}
.spec div{padding:12px 14px;border-bottom:1px solid var(--color-line);font-size:14px}
.spec div:nth-child(odd){border-right:1px solid var(--color-line)}
.spec span{display:block;color:var(--color-text-3);font-size:12px}
.buy{padding:20px;position:sticky;top:16px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--color-line-strong);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--color-primary);background:var(--color-primary-soft)}
.opt .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--color-line-strong);flex:none}
.opt.on .r{border:5px solid var(--color-primary)}
.opt b{flex:1;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}
.total b{font-size:22px}

/* 뷰어 */
.viewer{display:grid;grid-template-columns:1fr 280px;height:720px}
.canvas{position:relative;background:#f4f6f9;background-image:radial-gradient(#dfe3ea 1px,transparent 1px);background-size:20px 20px;overflow:hidden}
.canvas svg.plan{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--z,1));transition:transform .2s;width:640px}
.tool{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--color-line);border-radius:12px;padding:6px;box-shadow:var(--shadow-1)}
.tool button{width:38px;height:38px;border:0;border-radius:9px;background:none;display:grid;place-items:center;color:var(--color-text-2)}
.tool button:hover{background:var(--color-surface)}
.zoomlbl{position:absolute;left:16px;bottom:16px;background:#fff;border:1px solid var(--color-line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.minimap{position:absolute;right:16px;bottom:16px;width:150px;height:100px;background:#fff;border:1px solid var(--color-line);border-radius:10px;padding:6px}
.panel{border-left:1px solid var(--color-line);padding:18px;overflow:auto}
.panel h3{font-size:15px;margin:0 0 10px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--color-line);font-size:14px}
.sw{width:40px;height:24px;border-radius:999px;background:var(--color-line-strong);position:relative;border:0;padding:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--color-primary)}
.sw.on::after{left:19px}
.legend{font-size:13px;color:var(--color-text-2)}
.legend div{display:flex;justify-content:space-between;padding:6px 0}

/* 결제 */
.stepper{display:flex;gap:8px;align-items:center;margin-bottom:24px;font-size:14px;font-weight:700;color:var(--color-text-3)}
.stepper span{display:inline-flex;align-items:center;gap:6px}
.stepper span i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface);font-style:normal;font-size:12px}
.stepper span.on{color:var(--color-text)}
.stepper span.on i{background:var(--color-primary);color:#fff}
.stepper .ln{flex:0 0 32px;height:1px;background:var(--color-line-strong)}
.checkout{display:grid;grid-template-columns:1fr 360px;gap:24px}
.citem{display:grid;grid-template-columns:24px 88px 1fr auto;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--color-line)}
.citem .th{width:88px;height:66px;border-radius:10px;background:var(--color-surface);display:grid;place-items:center}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--color-line-strong);display:grid;place-items:center}
.cb.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{height:56px;border:1px solid var(--color-line-strong);border-radius:12px;background:#fff;font-weight:700;font-size:14px}
.pay button.on{border-color:var(--color-primary);background:var(--color-primary-soft);color:var(--color-primary)}
.sumrow{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}

/* 로그인 */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:640px}
.auth .art{background:linear-gradient(160deg,#2f5bea,#14b8a6);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.auth .art h2{font-size:30px;margin:0 0 8px;line-height:1.25}
.auth .fm{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:440px;margin:0 auto;width:100%}
.sns{height:46px;border-radius:12px;border:1px solid var(--color-line-strong);background:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.sns.k{background:#fee500;border-color:#fee500;color:#191600}
.sns.n{background:#03c75a;border-color:#03c75a;color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--color-text-3);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--color-line)}

/* 마이페이지 */
.my{display:grid;grid-template-columns:220px 1fr;gap:24px}
.side a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--color-text-2);font-weight:600;font-size:14px}
.side a.on{background:var(--color-surface);color:var(--color-text)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-weight:700;color:var(--color-text-3);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--color-line);background:var(--color-surface)}
.table td{padding:13px 12px;border-bottom:1px solid var(--color-line);vertical-align:middle}

/* 관리자 */
.adm{display:grid;grid-template-columns:232px 1fr;min-height:760px;background:var(--color-surface)}
.adm-side{background:#15181e;color:#aeb4bd;padding:18px 12px}
.adm-side .brand{color:#fff;margin:0 8px 22px}
.adm-side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#aeb4bd;text-decoration:none;font-size:14px;font-weight:600}
.adm-side a.on{background:#262a33;color:#fff}
.adm-side h5{font-size:11px;color:#6d7480;margin:16px 12px 6px;font-weight:700}
.adm-main{padding:24px 28px;min-width:0}
.adm-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.adm-head h1{font-size:22px;margin:0;flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:18px}
.kpi span{font-size:13px;color:var(--color-text-3)}
.kpi b{display:block;font-size:26px;margin:4px 0}
.up{color:var(--color-success);font-size:12px;font-weight:700}
.down{color:var(--color-danger);font-size:12px;font-weight:700}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.box-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--color-line)}
.box-h h3{margin:0;font-size:15px}
.toolbar{display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--color-line);flex-wrap:wrap}
.pager{display:flex;gap:4px;justify-content:center;padding:14px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--color-line);background:#fff;font-size:13px}
.pager button.on{background:var(--color-text);color:#fff;border-color:var(--color-text)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px}
.formgrid .full{grid-column:1/-1}
.upl{border:2px dashed var(--color-line-strong);border-radius:12px;padding:26px;text-align:center;color:var(--color-text-2);background:var(--color-surface)}

/* 상태 화면 */
.states{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:24px}
.state{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:28px}
.state h3{margin:6px 0 0;font-size:18px}
.state p{margin:0;color:var(--color-text-2);font-size:14px;max-width:280px}
.state .lbl{align-self:flex-start;margin-bottom:auto}
.sk{background:linear-gradient(90deg,#eef0f3 25%,#f7f8fa 50%,#eef0f3 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* 가이드 */
.guide{padding:32px}
.guide h2{font-size:20px;margin:28px 0 12px}
.guide h2:first-child{margin-top:0}
.sw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.swatch{border:1px solid var(--color-line);border-radius:12px;overflow:hidden;font-size:12px}
.swatch div{height:56px}
.swatch p{margin:0;padding:8px 10px}
.swatch code{color:var(--color-text-3);font-size:11px}
.type-row{display:grid;grid-template-columns:140px 1fr 160px;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--color-line)}
.type-row code{font-size:12px;color:var(--color-text-3)}
.states-row{display:grid;grid-template-columns:110px repeat(4,1fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-line);font-size:13px}
.states-row .h{font-size:12px;color:var(--color-text-3);font-weight:700}
.spc{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.spc div{background:var(--color-primary-soft);border:1px dashed var(--color-primary);border-radius:4px}
.spc span{display:block;text-align:center;font-size:11px;color:var(--color-text-3);margin-top:4px}

/* ===== 모바일 (프레임 폭 기준) ===== */
@container (max-width:700px){
  .gnb{padding:0 16px;height:56px;gap:12px}
  .gnb nav,.gnb .pc-only{display:none}
  .gnb .mo-only{display:inline-flex}
  .wrap{padding:20px 16px}
  .hero{padding:32px 16px 24px}
  .hero h1{font-size:28px}
  .hero p{font-size:15px}
  .grid4,.grid3,.steps{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr}
  .search-layout,.detail,.checkout,.my,.auth,.two{grid-template-columns:1fr}
  .filter{display:none}
  .mo-filter{display:flex!important}
  .lrow{grid-template-columns:88px 1fr;gap:12px;padding:12px}
  .lrow .th{width:88px;height:72px}
  .lrow .price{grid-column:2;text-align:left}
  .viewer{grid-template-columns:1fr;height:auto}
  .canvas{height:420px}
  .canvas svg.plan{width:340px}
  .panel{border-left:0;border-top:1px solid var(--color-line)}
  .minimap{display:none}
  .auth .art{display:none}
  .auth .fm{padding:32px 20px}
  .side{display:flex;overflow-x:auto;gap:4px}
  .side a{white-space:nowrap}
  .citem{grid-template-columns:24px 64px 1fr;gap:10px}
  .citem .th{width:64px;height:52px}
  .citem .price{grid-column:3;text-align:left}
  .adm{grid-template-columns:1fr}
  .adm-side{display:none}
  .adm-main{padding:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .states{grid-template-columns:1fr;padding:16px}
  .guide{padding:20px 16px}
  .sw-grid{grid-template-columns:repeat(3,1fr)}
  .type-row{grid-template-columns:1fr}
  .states-row{grid-template-columns:repeat(2,1fr)}
  .states-row .h:first-child{grid-column:1/-1}
  .formgrid{grid-template-columns:1fr}
  .table .hide-mo{display:none}
  .foot{padding:20px 16px}
  .tabbar{display:grid!important}
}
.mo-filter{display:none;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabbar{display:none;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--color-line);background:#fff;padding:6px 0 10px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--color-text-3);text-decoration:none}
.tabbar a.on{color:var(--color-primary)}

/* 보드 반응형 */
@media (max-width:900px){
  .board{grid-template-columns:1fr}
  .nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--color-line)}
  .nav h4{display:none}
  .nav button{white-space:nowrap;width:auto}
  .nav button i{display:none}
  .stage{padding:12px}
  .frame.mo{border-width:0;border-radius:16px}
}

/* ?raw: Figma 가져오기용 — 화면만 */
html.raw body{background:#fff}
html.raw .board-top,html.raw .nav,html.raw .stage-head,html.raw .note{display:none!important}
html.raw .board{display:block;min-height:0}
html.raw .stage{padding:0}
html.raw .frame,html.raw .frame.pc,html.raw .frame.mo{width:auto;max-width:none;border:0;border-radius:0;box-shadow:none;zoom:1!important}
</style>
</head>

    <h5>운영</h5>
    <a href="#" data-a="members"><svg width="18" height="18"><use href="#i-users"/></svg>회원 관리</a>
    <a href="#" data-a="register"><svg width="18" height="18"><use href="#i-doc"/></svg>도면 관리</a>
    <a href="#"><svg width="18" height="18"><use href="#i-won"/></svg>주문·결제</a>

<script>
if (/[?&]raw\b/.test(location.search)) document.documentElement.className = 'raw';
(function(){
  // 59A 평면도 (예시로 그린 구조)
  function plan(cls, w){
    return '<svg class="' + (cls||'') + '" viewBox="0 0 640 440" width="' + (w||'86%') + '" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard,sans-serif">' +
    '<g fill="#fff"><rect x="20" y="20" width="600" height="400"/></g>' +
    '<g data-l="furn" style="display:none" fill="#e8edfb" stroke="#b9c6ee" stroke-width="2"><rect x="250" y="250" width="150" height="60" rx="10"/><rect x="40" y="40" width="110" height="80" rx="6"/><rect x="460" y="300" width="120" height="70" rx="6"/><rect x="470" y="40" width="90" height="50" rx="6"/></g>' +
    '<g fill="none" stroke="#1f2430" stroke-width="10" stroke-linecap="square"><rect x="20" y="20" width="600" height="400"/>' +
    '<path d="M200 20v120M20 200h180M200 200v40M200 300v120M420 20v110M420 190v40M420 280h200M420 280v140M200 140h20M290 140h130M520 130h100"/></g>' +
    '<g fill="none" stroke="#1f2430" stroke-width="2"><path d="M200 240a60 60 0 0 1 60 60" stroke-dasharray="4 4"/><path d="M420 230a50 50 0 0 0-50 50" stroke-dasharray="4 4"/></g>' +
    '<g fill="#e8f2ff"><rect x="214" y="300" width="0" height="0"/></g>' +
    '<g data-l="lbl" font-size="15" font-weight="700" fill="#4a515c" text-anchor="middle"><text x="110" y="110">침실 2</text><text x="110" y="310">안방</text><text x="310" y="90">주방·식당</text><text x="310" y="230">거실</text><text x="520" y="80">침실 3</text><text x="520" y="215">욕실</text><text x="520" y="360">현관</text></g>' +
    '<g data-l="dim" font-size="12" fill="#2f5bea" text-anchor="middle"><path d="M20 8h600" stroke="#2f5bea" stroke-width="1"/><text x="320" y="4" dy="0">10,800</text><path d="M632 20v400" stroke="#2f5bea" stroke-width="1"/><text x="636" y="224" transform="rotate(90 636 224)">7,200</text><text x="110" y="135">3,300 × 3,000</text><text x="310" y="252">4,200 × 4,300</text></g>' +
    '</svg>';
  }
  var mini = document.getElementById('tplMini').innerHTML;
  var CX = [['○○파크 1단지','서울 ○○구','1,240세대','2014년','도면 6종','badge-blue'],['○○자이','경기 ○○시','2,018세대','2019년','인기','badge-green'],['○○푸르지오','인천 ○○구','876세대','2011년','도면 4종','badge-blue'],['○○힐스테이트','부산 ○○구','1,532세대','2021년','신규','badge-amber']];
  var cards4 = CX.map(function(c){ return '<div class="card cx"><div class="th">' + mini + '<span class="badge ' + c[5] + '">' + c[4] + '</span></div><div class="bd"><b>' + c[0] + '</b><span class="sub">' + c[1] + '</span><div class="row"><span class="badge badge-gray">' + c[2] + '</span><span class="badge badge-gray">' + c[3] + '</span></div></div></div>'; }).join('');
  var rows = CX.concat([['○○아이파크','서울 ○○구','612세대','2016년','도면 3종','badge-blue']]).map(function(c, i){ return '<div class="card lrow"><div class="th">' + mini + '</div><div><h3>' + c[0] + '</h3><div class="meta"><span><svg width="14" height="14"><use href="#i-pin"/></svg>' + c[1] + '</span><span><svg width="14" height="14"><use href="#i-bldg"/></svg>' + c[2] + '</span><span><svg width="14" height="14"><use href="#i-cal"/></svg>' + c[3] + '</span></div><div class="row" style="display:flex;gap:6px;margin-top:8px"><span class="badge badge-blue">59㎡</span><span class="badge badge-blue">84㎡</span>' + (i % 2 ? '<span class="badge badge-blue">114㎡</span>' : '') + '</div></div><div class="price">9,900원~<small>' + c[4] + '</small></div></div>'; }).join('');
  function fill(id){
    return document.getElementById(id).innerHTML
      .replace(/{{gnb}}/g, document.getElementById('t-gnb').innerHTML)
      .replace(/{{tabbar}}/g, document.getElementById('t-tabbar').innerHTML)
      .replace(/{{admside}}/g, document.getElementById('t-admside').innerHTML)
      .replace(/{{cards4}}/g, cards4).replace(/{{rows}}/g, rows).replace(/{{mini}}/g, mini)
      .replace(/{{plan}}/g, plan('', '86%')).replace(/{{planBig}}/g, plan('plan', ''));
  }
  var S = {
    home:['01 메인 홈','검색을 화면 한가운데에 두고, 인기 단지와 이용 방법을 바로 보여 줘요.','<b>설계 포인트</b> · 첫 화면에서 할 일(단지 검색)을 하나로 줄였어요. 모바일에서는 아래 탭바로 홈·검색·장바구니·마이를 오가요.'],
    login:['02 로그인·회원가입','간편 로그인을 먼저, 이메일 로그인은 아래에 두었어요.','<b>상태 표시</b> · 비밀번호 오류 상태(빨간 테두리 + 안내 문구)를 함께 그렸어요. 회원가입은 같은 레이아웃에 약관 동의 단계가 추가돼요.'],
    search:['03 단지 검색','PC는 왼쪽 필터, 모바일은 위쪽 가로 칩 필터예요.','<b>설계 포인트</b> · 걸린 필터를 결과 위에 배지로 보여 주고 바로 지울 수 있게 했어요. 결과가 없을 때 화면은 S1에 있어요.'],
    detail:['04 단지 상세','평형 탭 → 도면 미리보기 → 형식 고르기 → 구매 순서로 읽혀요.','<b>설계 포인트</b> · 구매 박스는 PC에서 스크롤해도 따라와요. 미리보기에는 워터마크를 넣어 원본 유출을 막아요. 도면은 예시로 그린 것이에요.'],
    viewer:['05 도면 뷰어','확대·축소, 치수·방 이름·가구 표시를 켜고 끌 수 있어요.','<b>눌러 보세요</b> · 왼쪽 위 +/− 버튼과 오른쪽 스위치가 실제로 동작해요. 개발 단계에서 손가락 확대(핀치)와 끌어서 이동을 넣어요.'],
    cart:['06 장바구니·결제','한 화면에서 고르고 결제까지 끝나요.','<b>설계 포인트</b> · 디지털 상품 환불 규정 동의를 결제 버튼 바로 위에 두었어요. 결제 완료 화면은 같은 틀에서 3단계로 이어져요.'],
    my:['07 마이페이지','구매한 도면을 다시 받는 곳이에요.','<b>설계 포인트</b> · 다운로드 남은 기간을 배지 색(초록→주황→회색)으로 보여 줘요. 모바일에서는 덜 중요한 열을 숨겨요.'],
    admin:['A1 관리자 대시보드','오늘 해야 할 일과 숫자를 첫 화면에 모았어요.','<b>설계 포인트</b> · 관리자 화면은 정보가 많아서 회색 배경 위 흰 카드로 구역을 나눴어요. 숫자는 모두 예시예요.'],
    members:['A2 회원 관리 목록','검색, 상태 필터, 엑셀 내려받기가 있는 기본 목록이에요.','<b>설계 포인트</b> · 이메일은 가려서 보여 주고, 상태는 배지 색으로 구분해요. 같은 목록 틀을 주문·도면·단지 관리에도 써요.'],
    register:['A3 도면 등록 폼','상세·등록 폼의 기본 틀이에요.','<b>상태 표시</b> · 입력 중(파란 테두리)과 오류(빨간 테두리 + 문구) 상태를 한 화면에 같이 넣었어요.'],
    states:['S1 상태 화면','빈 화면, 404, 로딩, 권한 없음.','<b>설계 포인트</b> · 상태 화면마다 다음에 할 행동 버튼을 하나씩 붙였어요. 로딩은 실제 레이아웃 모양의 스켈레톤이에요.'],
    guide:['G1 디자인 가이드','개발자에게 넘기는 색·글자·간격·컴포넌트 상태 정리예요.','<b>핸드오프</b> · Figma에서는 이 내용이 Variables와 컴포넌트 Variant로 들어가요. 개발자가 화면을 보고 바로 같은 이름의 값을 쓸 수 있어요.']
  };
  var cur = 'home', dev = 'pc', z = 1;
  var frame = document.getElementById('frame');
  function show(s){
    if (!S[s]) s = 'home';
    cur = s;
    frame.innerHTML = fill('s-' + s);
    document.getElementById('sTitle').textContent = S[s][0];
    document.getElementById('sDesc').textContent = S[s][1];
    document.getElementById('note').innerHTML = S[s][2];
    document.querySelectorAll('#nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.s === s); });
    frame.querySelectorAll('[data-a]').forEach(function(a){ a.classList.toggle('on', a.dataset.a === s); });
    if (s === 'guide') swatches();
    z = 1; bindViewer();
    if (location.hash !== '#' + s) history.replaceState(null, '', '#' + s + (dev === 'mo' ? '-mo' : ''));
  }
  function swatches(){
    var cs = getComputedStyle(document.documentElement);
    var names = ['primary','primary-hover','primary-soft','accent','text','text-2','text-3','line','line-strong','surface','success','warning','danger','success-soft','warning-soft','danger-soft','bg','primary-pressed'];
    document.getElementById('swatches').innerHTML = names.map(function(n){ var v = cs.getPropertyValue('--color-' + n).trim(); return '<div class="swatch"><div style="background:' + v + '"></div><p><b>' + n + '</b><br><code>' + v + '</code></p></div>'; }).join('');
  }
  function bindViewer(){
    var c = document.getElementById('canvas'); if (!c) return;
    var svg = c.querySelector('svg.plan'), zl = document.getElementById('zl');
    c.querySelectorAll('[data-z]').forEach(function(b){ b.onclick = function(){ var k = b.dataset.z; z = k === 'in' ? Math.min(2.5, z + .25) : k === 'out' ? Math.max(.5, z - .25) : 1; svg.style.setProperty('--z', z); zl.textContent = Math.round(z * 100) + '%'; }; });
    frame.querySelectorAll('[data-layer]').forEach(function(b){ b.onclick = function(){ b.classList.toggle('on'); var on = b.classList.contains('on'); svg.querySelectorAll('[data-l="' + b.dataset.layer + '"]').forEach(function(g){ g.style.display = on ? '' : 'none'; }); }; });
  }
  frame.addEventListener('click', function(e){
    var t = e.target.closest('[data-tabs] button'); if (t){ t.parentElement.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === t); }); }
    var o = e.target.closest('.opt'); if (o){ o.parentElement.querySelectorAll('.opt').forEach(function(x){ x.classList.toggle('on', x === o); }); var p = o.querySelector('span:last-child').textContent; var tb = o.parentElement.querySelector('.total b'); if (tb) tb.textContent = p; }
    var ch = e.target.closest('.chip'); if (ch && ch.parentElement.classList.contains('chips')){ ch.classList.toggle('on'); }
    var pb = e.target.closest('.pay button'); if (pb){ pb.parentElement.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === pb); }); }
    var a = e.target.closest('[data-a]'); if (a){ e.preventDefault(); show(a.dataset.a); return; }
    if (e.target.closest('a[href="#"]')) e.preventDefault();
  });
  document.getElementById('nav').onclick = function(e){ var b = e.target.closest('[data-s]'); if (b){ show(b.dataset.s); window.scrollTo(0, 0); } };
  function setDev(d){ dev = d; frame.className = 'frame ' + d; fit(); document.querySelectorAll('#dev button').forEach(function(b){ b.classList.toggle('on', b.dataset.d === d); }); history.replaceState(null, '', '#' + cur + (d === 'mo' ? '-mo' : '')); }
  document.getElementById('dev').onclick = function(e){ var b = e.target.closest('[data-d]'); if (b) setDev(b.dataset.d); };
  function fit(){ if (document.documentElement.className === 'raw') return; var st = document.querySelector('.stage'), w = st.clientWidth - 24; frame.style.zoom = dev === 'pc' && w < 1280 ? (w / 1280).toFixed(3) : ''; }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); setDev(/-mo$/.test(h) ? 'mo' : 'pc'); show(h.replace(/-mo$/, '')); });
  var h = location.hash.slice(1), mo = /-mo$/.test(h);
  if (mo || (!h && window.innerWidth < 700)) setDev('mo');
  show(h.replace(/-mo$/, '') || 'home');
  fit();
})();
</script>
